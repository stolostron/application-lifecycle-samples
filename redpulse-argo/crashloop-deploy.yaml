apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-app-deploy
  labels:
    app: crashloop-app
spec:
  selector:
    matchLabels:
      app: crashloop-app
  replicas: 1
  template:
    metadata:
      labels:
        app: crashloop-app
    spec:
      containers:
      - name: crashloop-container
        image: busybox:latest
        command: ["sh", "-c", "exit 1"]
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
